name: CI/CD - Meridian Intelligence
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: meridian-495517
  IMAGE_NAME: meridian-intelligence

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -e ".[dev]"
          fi

      - name: Run tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}

          EVENT_DISCOVERY_ENABLE_SERPAPI: true
          EVENT_DISCOVERY_ENABLE_EVENTBRITE: false
          EVENT_DISCOVERY_ENABLE_TICKETMASTER: true

        run: |
          echo "Running event scraping tests..."

          # Run event discovery tests via python module execution
          python3 -m tests.events.scrape.test

          # echo "Running supabase tests..."

          # Run supabase tests via pytest
          # pytest tests/supabase -q --maxfail=1 --disable-warnings

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy meridian-intelligence \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --no-allow-unauthenticated \
            --update-env-vars GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --update-env-vars SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --update-env-vars SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
            --update-env-vars SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --update-env-vars SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY }} \
            --update-env-vars EVENTBRITE_PRIVATE_TOKEN=${{ secrets.EVENTBRITE_PRIVATE_TOKEN }} \
            --update-env-vars TICKETMASTER_API_KEY=${{ secrets.TICKETMASTER_API_KEY }} \
            --update-env-vars EVENT_DISCOVERY_ENABLE_SERPAPI=true \
            --update-env-vars EVENT_DISCOVERY_ENABLE_EVENTBRITE=false \
            --update-env-vars EVENT_DISCOVERY_ENABLE_TICKETMASTER=true