[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "supabase",
    "google-genai",
    "requests",
    "uvicorn",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/outreach_engine"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]